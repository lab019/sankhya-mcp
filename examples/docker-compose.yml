      SANKHYA_CLIENT_SECRET: ${SANKHYA_CLIENT_SECRET}
      SANKHYA_X_TOKEN: ${SANKHYA_X_TOKEN}
      SANKHYA_ENV: ${SANKHYA_ENV:-sandbox}

  mcp-financeiro:
    build:
      context: ..
      dockerfile: servers/mcp-financeiro/Dockerfile
    image: sankhya-mcp-financeiro
    stdin_open: true
    tty: false
    environment:
      SANKHYA_CLIENT_ID: ${SANKHYA_CLIENT_ID}
      SANKHYA_CLIENT_SECRET: ${SANKHYA_CLIENT_SECRET}
      SANKHYA_X_TOKEN: ${SANKHYA_X_TOKEN}
      SANKHYA_ENV: ${SANKHYA_ENV:-sandbox}

  mcp-suprimentos:
    build:
      context: ..
      dockerfile: servers/mcp-suprimentos/Dockerfile
    image: sankhya-mcp-suprimentos
    stdin_open: true
    tty: false
    environment:
      SANKHYA_CLIENT_ID: ${SANKHYA_CLIENT_ID}
      SANKHYA_CLIENT_SECRET: ${SANKHYA_CLIENT_SECRET}
      SANKHYA_X_TOKEN: ${SANKHYA_X_TOKEN}
      SANKHYA_ENV: ${SANKHYA_ENV:-sandbox}

  mcp-rh:
    build:
      context: ..
      dockerfile: servers/mcp-rh/Dockerfile
    image: sankhya-mcp-rh
    stdin_open: true
    tty: false
    environment:
      SANKHYA_CLIENT_ID: ${SANKHYA_CLIENT_ID}
      SANKHYA_CLIENT_SECRET: ${SANKHYA_CLIENT_SECRET}
      SANKHYA_X_TOKEN: ${SANKHYA_X_TOKEN}
      SANKHYA_ENV: ${SANKHYA_ENV:-sandbox}

  mcp-cadastros:
    build:
      context: ..
      dockerfile: servers/mcp-cadastros/Dockerfile
    image: sankhya-mcp-cadastros
    stdin_open: true
    tty: false
    environment:
      SANKHYA_CLIENT_ID: ${SANKHYA_CLIENT_ID}
      SANKHYA_CLIENT_SECRET: ${SANKHYA_CLIENT_SECRET}
      SANKHYA_X_TOKEN: ${SANKHYA_X_TOKEN}
      SANKHYA_ENV: ${SANKHYA_ENV:-sandbox}
